name: perturb-seq-eval-tests

# The reference platform for perturb-seq-eval's test suite (HACA-121).
#
# Three tests pin numbers bit-exactly (two MLPBackbone regression pins and the
# v0.6.0 summary reproduction). They pass on x86_64 and fail by ~2 ulp on the
# aarch64 Paperclip host, at every commit including base 40c814f, so a host run
# cannot stand as the test record for /pr-prep. This job runs the module's
# quality.test_command on ubuntu x86_64 / Python 3.12; a green run here is the
# test record a worktree agent cites (docs/ci/perturb-seq-eval-reference-platform.md).
#
# Dependencies come from pyproject.toml (dev + research + scgpt + paper groups),
# not poetry.lock: the lock is stale against pyproject (torch 2.11 vs ==2.14.0).
# numpy / scipy / scikit-learn are pinned to the poetry.lock versions for Python
# >=3.11: the MLP pin is pure numpy and moves by 1 ulp with the numpy build
# (numpy 2.5.5 fails it on x86_64, run 45107486401). torch is the CPU wheel.

on:
  push:
    branches: [main]
    paths:
      - "projects/perturb-seq-eval/**"
      - ".github/workflows/perturb-seq-eval-tests.yml"
  pull_request:
    paths:
      - "projects/perturb-seq-eval/**"
      - ".github/workflows/perturb-seq-eval-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perturb-seq-eval-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/perturb-seq-eval

jobs:
  pytest-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history: several tests `git show` historical SHAs (provenance pins).
      # The PR head, not the synthetic merge commit: the run must be on the same
      # commit a receipt's hash E names, and some tests check HEAD is a real commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the module and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . "numpy==2.4.4" \
            "pytest>=8" "pytest-cov>=4" \
            "scikit-optimize>=0.10" "cma>=3.3" "scikit-learn==1.8.0" "scipy==1.17.1" \
            "scanpy>=1.10" "anndata==0.12.19" "h5py==3.16.0" \
            "matplotlib>=3.8" "pandas>=2.2" "pyarrow>=16" "plotly>=5.22" \
            pyyaml

      - name: Record the platform (cite this with the run URL)
        run: |
          python - <<'PY'
          import platform, sys
          print(f"machine={platform.machine()} python={sys.version.split()[0]} libc={'-'.join(platform.libc_ver())}")
          PY
          python -m pip freeze | tee "$RUNNER_TEMP/pip-freeze.txt"
          echo "commit=$(git rev-parse HEAD) module_tree=$(git rev-parse HEAD:projects/perturb-seq-eval)"

      - name: quality.test_command_perturb-seq-eval
        run: python -m pytest -q -p no:cacheprovider tests
