#   zero hits. Row 33 (2026-10-23) approves the roster's FORM and entry count -- not this
#   provenance statement -- so it is not a substitute citation and is not offered as one.
#   The error was a correct row number attached to the wrong subject, which is the exact defect
#   this block was written to remove. Found by review, not by the author.
#   DURABLE, in-repo, reproducible:
