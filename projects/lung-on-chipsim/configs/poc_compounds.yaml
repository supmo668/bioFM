#          2026-09-20.
#     this file -- every one of the 26 entries carries its own `evidence_doi`.
#   LOST, and NOT recoverable from the repository:
#     the full per-row table -- compound, key, ATC, WHAT EACH SOURCE SHOWS, DOI and
#     CONFIDENCE TIER -- existed only on a claude.ai artifact that no longer resolves.
#     A dead pointer to it used to sit on this line. It is removed rather than
#     re-pointed: artifact URLs are ACCOUNT-SCOPED, so such a citation is unreadable
#     for every account but its author's and dead for every reader of a published
#     paper from the moment of publication.
# No substitute source has been invented for the lost table. The 13 rejections'
# individual reasons and the per-row confidence tiers are gone; the counts survive.
#
# Identity and citation only -- no biological numbers.
# ============================================================================

