# ChipSim environment configuration — build-plan S6.
#
# NON-BIOLOGICAL ONLY. This file carries paths and source coordinates.
# `theta_priors.yaml` and `assumptions.yaml` are deliberately ABSENT: every value
# in them is a human-entered biological number with a citation, and no coding
# agent may create them (build-plan Global Constraints).

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  snapshot: data/raw/drugbank

snapshot:
  # The dhimmel/drugbank public snapshot of DrugBank 4.2 (downloaded 2015-03-19).
  # The commit is NOT pinned here — it is pinned by H in T2, into
  # data/raw/drugbank/provenance.yaml, which is the single source of truth.
  repo: dhimmel/drugbank
  branch: gh-pages
  raw_base: https://raw.githubusercontent.com

dvc:
  remote_name: local
  remote_url: ../../.dvc-storage
