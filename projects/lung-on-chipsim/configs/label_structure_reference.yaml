schema_version: '1'
purpose: 'Reference for the T13 worksheet''s generated column `label_disagrees_with_key`
  (principal ruling via CTO #126). Tri-state: a row whose base name is absent here,
  or whose key matches neither enantiomer, is `unresolved` — never a false `agrees`.'
source: PubChem PUG REST, /compound/name/<L-|D-><base>/property/InChIKey
retrieved_on: '2026-09-15'
recorded_on: '2026-09-15'
admission_rule: a base name is listed only if PubChem resolves BOTH 'L-<base>' and
  'D-<base>' by name to distinct InChIKeys sharing a skeleton block
not_a_live_lookup: 'Committed deliberately: a worksheet must regenerate identically
  offline, and a network call inside human-artefact generation is a reproducibility
  hazard (CTO #126 §2).'
excluded_as_drugbank_coined:
  base_names:
  - 1-(4-chlorophenyl)-2-(acetamido)ethane boronic acid
  - 1-naphthyl-2-acetamido-ethane boronic acid
  - '[(n-hydroxyamino)carbonyl]phenylalanine'
  - naphthyl-1-acetamido boronic acid alanine
  quoted_deliberately: 'A deliberate, reasoned exception to the DrugBank-coined-titles
    rule (CTO ruling on QG F-14, 2026-09-16), on the ledger precedent (#120 §4): these names
    appear here with no structure and no accession beside them — identification without
    association — and an exclusion nobody can name is an exclusion nobody can audit.'
  reason: 'PubChem resolves these, so admission was not a rule violation — but they
    read as DrugBank record titles rather than names a chemist would use, and the
    invariant test is ''would this string exist if DrugBank did not?'' (CTO #122 §1).'
  measured_cost: '8 snapshot rows lose their agreement check and report `unresolved`:
    2 for [(n-hydroxyamino)carbonyl]phenylalanine, 2 for 1-(4-chlorophenyl)-2-(acetamido)ethane
    boronic acid, and 4 across the two naphthyl spellings (1-naphthyl-2-acetamido-ethane
    boronic acid, naphthyl-1-acetamido boronic acid alanine), which PubChem resolves
    separately and which the draft carried as two entries. An earlier line here said
    "6 rows" for three names — it predated finding the second naphthyl spelling, and
    contradicted this block''s own four-entry list.'
known_coverage_gap: 'Three of the eleven label errors the CTO measured cannot be decided
  by a NAME-keyed table: for `treitol`, `benzylsuccinic acid` and `xylitol`, PubChem
  returns the SAME InChIKey for both the L- and the D- name. Rows with those base
  names therefore report `unresolved`, not `disagrees`. Also excluded: `glucuronic
  acid`, `iduronic acid`, `rhamnose` — their L/D names resolve to keys with DIFFERENT
  skeleton blocks, so the pair is not a clean enantiomer pair. NAMED EXAMPLE, so the
  gap is concrete rather than abstract: the CTO''s per-row measurement resolved D-treitol
  as a GENUINE label error, and this table reports it `unresolved`. The gap is ACCEPTED
  and recorded (CTO, 2026-09-15) rather than patched with a per-row override list
  — an override would be a second source of truth beside this table, and it would
  drift.'
neutral_keys_only: 'Every key is the NEUTRAL (-N) form, because pipeline keys are neutralised
  and a charged key can never match one. Two entries originally carried the charged key
  PubChem returns for the name (-L, -K) and so could never report anything but
  `unresolved` (QG F-03, 2026-09-16); they carry a `*_neutralised` note. The loader
  rejects any non-neutral key.'
