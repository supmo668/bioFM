# ============================================================================
# Barrier transporter / receptor panel — build-plan T7 (agent-drafted DRAFT).
#
# `ratified` is a REAL, FILE-LEVEL, PARSED BOOLEAN key (defects 1, 18) — not a
# comment and not per-entry. It is `false` here and MUST stay false until a human
# ratifies the accessions in T8.
#
#   *** NO AGENT MAY SET `ratified: true`, `ratified_by` OR `ratified_on`. ***
#
# T8 is human-owned: check every accession against UniProt, correct any that are
# wrong, delete entries per the deletion criterion below, then set ratified: true
# and fill ratified_by / ratified_on.
#
#   DELETION CRITERION — read this before deleting anything. The r2 wording,
#   "delete any not expressed in airway epithelium", is a TRAP if read against
#   UniProt's tissue comment: five of seven entries have no lung mention there,
#   INCLUDING ABCB1. Principal's ruling: delete ONLY on positive evidence of
#   ABSENCE. Silence in a curated database is a curation gap, never evidence.
#   See CONTEXT.md, "Standing rules".
#
# Why this matters: a wrong accession silently EMPTIES a join and yields an
# *empty* rather than a *wrong* result — a failure that looks like success.
# chipsim.harmonize.pgp_label resolves ABCB1 FROM this file by symbol; it never
# hard-codes P08183 (defect 4 / AM-2: composition is configuration, not code).
#
# The accessions below are the agent's DRAFT reading of the canonical human
# entries. They are a starting point for T8's review, NOT a verified list.
# tests/test_barrier_panel.py (T19) checks each against the live UniProt API;
# it does NOT check membrane polarity or airway expression.
#
# IDENTITY ONLY — no numbers. AM-3 splits this file from theta_priors.yaml
# precisely because "no agent writes a biological number" cuts here. Evidence,
# ratios and rationale live in workstreams/lung-on-chipsim/T8-review-record.md,
# NOT in this file.
#
#   REVIEW RECORD: workstreams/lung-on-chipsim/T8-review-record.md
#   It is REVIEW INPUT, not a completed review. Its existence is NOT evidence
#   that ratification occurred, and it confers no authority to set the three
#   fields above. Durable refs: dispatches #15, #16, #17.
# ============================================================================

ratified: false
ratified_by: ""
ratified_on: ""
# Set by the HUMAN at T8, by running:  chipsim panel-seal --panel configs/barrier_panel.yaml
# Detects modification of a sealed panel. It does NOT prove a human attested —
# the digest is unkeyed over public content, so anything that can write
# `ratified: true` can compute it. Tamper-evidence, not authentication.
ratified_panel_sha256: ""
panel:
  - {symbol: ABCB1,   uniprot: P08183, alias: "P-gp / MDR1",  face: apical}
  - {symbol: ABCG2,   uniprot: Q9UNQ0, alias: "BCRP",         face: apical}
  - {symbol: ABCC1,   uniprot: P33527, alias: "MRP1",         face: basolateral}
  # face: corrected apical -> basolateral on the principal's ruling from measured
  # localization data. AUTHORIZED: build-plan.md T7 prescribes `basolateral` as of
  # r2.3 (CTO ruling N1, dispatch #18), re-signed at b5443bd. The measured evidence
  # and BOTH caveats live in T8-review-record.md "Ruling 2" — not here: this file is
  # identity-only under AM-3 and carries no quantities, and the numeric-leaf
  # validator cannot see comments, so a number in one is invisible to it.
  - {symbol: TFRC,    uniprot: P02786, alias: "TfR1",         face: basolateral}
  - {symbol: FCGRT,   uniprot: P55899, alias: "FcRn",         face: apical}
  - {symbol: SLC15A1, uniprot: P46059, alias: "PepT1",        face: apical}
  - {symbol: SLCO2B1, uniprot: O94956, alias: "OATP2B1",      face: basolateral}
