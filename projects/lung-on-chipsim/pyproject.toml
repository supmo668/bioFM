[project]
name = "chipsim"
version = "0.1.0"
description = "ChipSim — lung-on-chip exposure and barrier-response simulator (M0 data spine)."
requires-python = ">=3.11,<3.13"

# Runtime dependencies. `pyarrow` is pinned (not floated) because parquet bytes
# are not stable across pyarrow versions and T5a/T15 record a sha256 over the
# serialized file — build-plan S2 / defect 27.
dependencies = [
    "pandas",
    "pyarrow==25.0.1",
    "PyYAML",
    "requests",
    # Pinned for the same reason as pyarrow, and with more at stake: rdkit performs
    # the salt-strip -> neutralize -> tautomer-canonicalize -> InChIKey chain in T5b,
    # and that canonical InChIKey is the join key for T10/T13/T15 and the key the
    # sealed allocation is built on. Tautomer canonicalization and the bundled InChI
    # toolkit both change across releases, so an unpinned rdkit can silently
    # repartition the splits while every recorded sha256 and every test stays green.
    "rdkit==2026.3.5",
]

[project.scripts]
# T8 tells the human to run `chipsim panel-seal`. Without this the documented
# command does not exist and T8 is self-blocking — the exact failure T7a was
# created to prevent (C4).
chipsim = "chipsim.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chipsim"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "dvc",
    # Type checking. The M1 input contracts hand frozen, read-only mappings to the
    # fit; `ty` is what catches a caller that tries to mutate one, which a test can
    # only catch where somebody thought to write the test.
    "ty",
    # The sandbox's aviary Environment is async (aviary's contract is two async methods),
    # so its tests are coroutines and need a runner.
    "pytest-asyncio",
]

[project.optional-dependencies]
# The aviary Environment is a DELIVERY surface, not a modelling layer, so `fhaviary` is an
# extra rather than a runtime dependency: `import chipsim` and the whole data spine must keep
# working on a machine that has never heard of aviary. chipsim.sandbox.readiness and
# .interpretability are importable without it; only .env needs it, and its tests skip.
sandbox = ["fhaviary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: hits a live remote endpoint (T19 UniProt verification); deselect with -m 'not network'",
    "integration: requires a human-gated artifact or the fetched snapshot on disk; deselect with -m 'not integration'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
