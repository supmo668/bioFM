# arXiv packaging manifest for this paper.
#
# THIS PAPER'S SUBMISSION PATH (approvals row 34, 2026-11-21): arXiv cs.LG by personal endorsement. Row 32 had
# closed the arXiv path; row 34 reversed it when TechRxiv closed for submissions.
#
# This file is the ONLY thing that ties the generic pipeline (scripts/arxiv_package.py
# + .github/workflows/arxiv-package.yml) to this particular paper. A second paper in
# this repo opts in by dropping its own arxiv.toml beside its root .tex — no code change.
#
# See scripts/README-arxiv.md for every key and what the pipeline does with it.

root_tex = "paper.tex"
bundle_name = "perturb-seq-eval"

# Title, authors and abstract are NOT duplicated here. They are read from the CFF so
# there is one place a title can be wrong. Overriding `title`, `authors` or `abstract`
# in this file is possible but means the repo then carries two answers to one question.
citation_cff = "../CITATION.cff"


# arXiv's license menu wording. CC BY 4.0 matches the Zenodo deposit's licence, so the
# preprint and the archived record do not disagree about reuse terms.
license = "CC BY 4.0"

# The Comments field is the ONLY place on an arXiv abstract page where a DOI to an
# external archive can be stated by the author, and it is what makes the arXiv record
# and the Zenodo record discoverable as one work rather than two.
comments = """
Pre-registered study; pre-registration and provenance manifests included. \
Archived with full data and code at doi:10.5281/zenodo.19716140 (concept DOI). \
The same work is deposited on Figshare as doi:10.6084/m9.figshare.32086920 (all versions).
"""

# Packages used by this paper that are not in the pipeline's vouched TeX Live set.
# Empty means every \usepackage in the document is one the pipeline already vouches
# for. Adding a name here is an author's assertion that arXiv's TeX Live provides it.
acknowledge_packages = []

# VENUE-SPECIFIC ABSTRACT - deliberately overriding the CITATION.cff one, which is the
# canonical scholarly abstract and must not be reshaped to suit a submission form.
#
# arXiv imposes two hard limits (info.arxiv.org/help/prep): metadata fields accept ASCII
# ONLY, and "Abstracts over 1920 characters are rejected." The CFF abstract is 3795
# characters with 4 non-ASCII characters (measured 2026-11-25; it was 3222 with 5 before the
# self-containment pass), so arXiv refuses it outright. `metadata` now
# fails closed on both, with a self-test case proving each check fires.
#
# This version is 1915 characters, 0 non-ASCII. The tooling checks only the length and ASCII
# limits; tests pin the result tokens, tie each rho to its generated macro and allow-list every
# other decimal. Its history, oldest first:
#
# 1. 1914 characters (approvals row 18, CTO #905, with the Amendment 5 rename). Superseded.
# 2. 2026-11-23, HACA-118/119: rewritten from the manuscript abstract, which no longer uses project
#    shorthand. The hypotheses are named by what they claim instead of H1-H5, the tally is a sentence
#    ("four of the five hypotheses are supported and the cross-dataset transfer hypothesis is not;
#    every hypothesis could be evaluated"), and the "Design:" / "LLM condition:" / "Outcomes:"
#    fragments are sentences. Every number, the rho = 0.286 result and the integrity claim that every
#    hypothesis could be evaluated were preserved. Superseded.
# 3. 2026-11-23, approvals row 39 (review ruling A, disclose and reframe): 1903 characters. It added
#    that the confidence drop follows shown held-out error, the exploratory pre-feedback rho from
#    paper/sections/generated_exploratory.tex, and that the probe and recommender are not evaluated.
#    Superseded.
# 4. 2026-11-24, quality gate on the row-39 manuscript. Superseded. It names the screen of each
#    exploratory rho, says "mean confidence" (only the round-0 MEAN confidence is null), restores
#    "in both screens; exploratory, no claim" on the ACE sentence, and replaces "The supported result
#    is ..." with "The pass is consistent with ...; it is not evidence that ...", because "supported"
#    is the paper's word for a criterion outcome. "and the composite that inherits it" (in the
#    manuscript abstract) is left out for length. No result changes.
# 5. 2026-11-25, self-containment pass: this version. Every label, abbreviation and symbol is
#    defined where it is first used or written out: the metrics used once are no longer listed by
#    acronym, the two datasets are called screens of the K562 cell line, the Architect and the
#    backbone are glossed, "Spearman's" precedes the first rho, the ranking result is said to
#    meet its criterion (so "The pass" has an antecedent), and the note-like closing fragments
#    are sentences. "run via MassGen" is left out for length (the manuscript abstract keeps it).
#    No result or caveat changes.
#
# A TOML LITERAL string is required here so the TeX backslashes are not escape-processed.
abstract = '''That a single agent's own vote distribution can gate its compute is reported (CATTS, arXiv:2602.12276); we ask the multi-agent question: does the distribution of confidences stated by a group of agents predict task difficulty, enabling adaptive compute allocation? In a five-agent CellForge-style system that predicts Perturb-seq (single-cell CRISPR screen) responses, we define run metrics, including Agent Confidence Entropy (ACE), and a composite Task Difficulty Index (TDI). We pre-register five hypotheses: low attainable error on Adamson 2016 and on Norman 2019, varied backbone choice by the Architect (the model-choosing agent), the rank correlation of each TDI component with error, and cross-dataset transfer of a calibrated TDI. We test them on 41 held-out perturbations from these K562 screens (21 Adamson, 15 Norman single-gene, 5 Norman two-gene), with 27 trained-model records and three agent runs each; agents are pinned Claude models (Haiku 4.5, Sonnet 5.5). We find that four of the five hypotheses are supported and the cross-dataset transfer hypothesis is not; every hypothesis could be evaluated. Within each screen the confidence drop across rounds ranks tasks by error, meeting its criterion; the fitted composite misses the transfer criterion at the pre-registered level (Spearman's $\rho$ = 0.286 against > 0.4). From round two on, prompts carry the prior round's held-out error, so that drop follows a shown error; the mean confidence stated before any feedback does not rank tasks ($\rho$ = 0.003 on Adamson and 0.214 on Norman; this is exploratory). The pass is consistent with confidence falling further after a larger shown error; it is not evidence that it anticipates difficulty. ACE, an evenness index, runs against the pre-registered direction in both screens. This too is exploratory; no claim is made. A one-round probe and configuration recommender are specified, not evaluated.'''

# NOTE: [categories] is LAST on purpose. A TOML table header captures every key
# that follows it, so a scalar placed after it silently becomes categories.<key>
# and reads as absent. Keep every top-level scalar ABOVE this line.
[categories]
# cs.LG primary: the contribution is a pre-registered test of multi-agent trace
# statistics as a task-difficulty signal (motivating adaptive compute allocation).
# q-bio.QM cross-list: the evaluation substrate is Perturb-seq response prediction,
# which is where a quantitative-biology reader would look for it. cs.MA cross-list:
# the claim is being narrowed (ruled, approvals row 11, 2026-10-31) to a MULTI-AGENT
# group's confidence/critique distribution; the nearest prior art (arXiv:2602.12276)
# is single-agent and sits in cs.AI, so the multi-agent reader is reached via cs.MA
# (ruled, approvals row 12, 2026-11-01).
primary = "cs.LG"
cross_list = ["q-bio.QM", "cs.MA"]
