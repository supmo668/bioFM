# arXiv packaging manifest for this paper.
#
# This file is the ONLY thing that ties the generic pipeline (scripts/arxiv_package.py
# + .github/workflows/arxiv-package.yml) to this particular paper. A second paper in
# this repo opts in by dropping its own arxiv.toml beside its root .tex — no code change.
#
# See scripts/README-arxiv.md for every key and what the pipeline does with it.

root_tex = "paper.tex"
bundle_name = "perturb-seq-eval"

# Title, authors and abstract are NOT duplicated here. They are read from the CFF so
# there is one place a title can be wrong. Overriding `title`, `authors` or `abstract`
# in this file is possible but means the repo then carries two answers to one question.
citation_cff = "../CITATION.cff"


# arXiv's license menu wording. CC BY 4.0 matches the Zenodo deposit's licence, so the
# preprint and the archived record do not disagree about reuse terms.
license = "CC BY 4.0"

# The Comments field is the ONLY place on an arXiv abstract page where a DOI to an
# external archive can be stated by the author, and it is what makes the arXiv record
# and the Zenodo record discoverable as one work rather than two.
comments = """
Pre-registered study; pre-registration and provenance manifests included. \
Archived with full data and code at doi:10.5281/zenodo.19716140 (concept DOI). \
The same release is deposited on Figshare as doi:10.6084/m9.figshare.32086920.v6.
"""

# Packages used by this paper that are not in the pipeline's vouched TeX Live set.
# Empty means every \usepackage in the document is one the pipeline already vouches
# for. Adding a name here is an author's assertion that arXiv's TeX Live provides it.
acknowledge_packages = []

# VENUE-SPECIFIC ABSTRACT - deliberately overriding the CITATION.cff one, which is the
# canonical scholarly abstract and must not be reshaped to suit a submission form.
#
# arXiv imposes two hard limits (info.arxiv.org/help/prep): metadata fields accept ASCII
# ONLY, and "Abstracts over 1920 characters are rejected." The CFF abstract is 2363
# characters with 5 non-ASCII characters, so arXiv refuses it outright. `metadata` now
# fails closed on both, with a self-test case proving each check fires.
#
# This version is 1914 characters, 0 non-ASCII. It is re-derived from the abstract whose
# opening names CATTS (approvals row 17) by ten named compressions c1-c10 (staging 3711ac6
# section 3.2): c1 the opening folded into one question with "as operated here"; c2 drop
# "compute-free"; c3 "Perturb-seq orchestrator run via MassGen"; c4 "composite Task Difficulty
# Index"; c5 "Five pre-registered gates:" (drafted wording; renamed below); c6 "the Architect's backbone-choice entropy, each
# TDI component's rank correlation"; c7 "Design: ..."; c8 "LLM condition: ..."; c9
# "Confidence-entropy point estimates"; c10 "The v0.5.0 release's values". Every number, every
# hypothesis label H1-H5, the rho = 0.286 result and the "0 unevaluated" integrity claim are
# preserved; that was checked against the previous override's token set when it was derived.
# The tooling checks only the length and ASCII limits, not the content.
# Drafted at 1916 characters and re-ratified as drafted (approvals row 18, CTO #905). It was then
# applied with the Amendment 5 rename of "gate" (row 14; principal, 2026-11-05):
# "Five pre-registered criteria:" and "Outcomes: 4 of 5 pass", giving 1916 -> 1914 characters.
# Supersedes the 2026-10-30 override (1906 characters, author-ratified then).
#
# A TOML LITERAL string is required here so the TeX backslashes are not escape-processed.
abstract = '''That a single agent's own vote distribution can gate its compute is reported (CATTS, arXiv:2602.12276); we ask the multi-agent question: does the distribution of stated confidences and critiques across a group of role-specialised agents predict task difficulty, so the group's compute -- spent uniformly across tasks as operated here -- can be allocated adaptively? In a five-agent CellForge-style Perturb-seq orchestrator run via MassGen, we define four trace metrics -- Agent Confidence Entropy (ACE), Critique Severity Dispersion (CSD), a convergence signal ($\Delta$C), and a Winner Flip Rate (WFR) -- and their composite Task Difficulty Index (TDI). Five pre-registered criteria: attainable error on Adamson 2016 (CRISPR interference) and Norman 2019 (CRISPR activation), the Architect's backbone-choice entropy, each TDI component's rank correlation with error, and cross-dataset transfer of a calibrated TDI. Design: 41 held-out K562 tasks (21 Adamson, 15 Norman singletons, 5 Norman doublets) drawn deterministically; 27 trainer-sweep records and three fixed-length agentic runs per task. LLM condition: a pinned Anthropic Claude roster (Haiku 4.5 for the four proposer roles, Sonnet 5.5 for the Validator), served model recorded and asserted per call; any rule-based fallback invalidates the run. Outcomes: 4 of 5 pass; H5 fails (0 unevaluated) -- the trainer sweep attains the pre-registered error on both screens (H1, H2), the Architect exercises its backbone choice (H3), and the confidence-drop component and the composite rank tasks by held-out error within both screens (H4); the Adamson-calibrated composite does not transfer to Norman at the pre-registered level (H5, $\rho$ = 0.286 against > 0.4). Confidence-entropy point estimates run against the pre-registered direction in both screens (exploratory). The v0.5.0 release's values are superseded in full; the defects are listed in the appendix.'''

# NOTE: [categories] is LAST on purpose. A TOML table header captures every key
# that follows it, so a scalar placed after it silently becomes categories.<key>
# and reads as absent. Keep every top-level scalar ABOVE this line.
[categories]
# cs.LG primary: the contribution is a pre-registered test of multi-agent trace
# statistics as a task-difficulty signal (motivating adaptive compute allocation).
# q-bio.QM cross-list: the evaluation substrate is Perturb-seq response prediction,
# which is where a quantitative-biology reader would look for it. cs.MA cross-list:
# the claim is being narrowed (ruled, approvals row 11, 2026-10-31) to a MULTI-AGENT
# group's confidence/critique distribution; the nearest prior art (arXiv:2602.12276)
# is single-agent and sits in cs.AI, so the multi-agent reader is reached via cs.MA
# (ruled, approvals row 12, 2026-11-01).
primary = "cs.LG"
cross_list = ["q-bio.QM", "cs.MA"]
