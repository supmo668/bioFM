# arXiv packaging manifest for this paper.
#
# THIS PAPER'S SUBMISSION PATH (approvals row 34, 2026-11-21): arXiv cs.LG by personal endorsement. Row 32 had
# closed the arXiv path; row 34 reversed it when TechRxiv closed for submissions.
#
# This file is the ONLY thing that ties the generic pipeline (scripts/arxiv_package.py
# + .github/workflows/arxiv-package.yml) to this particular paper. A second paper in
# this repo opts in by dropping its own arxiv.toml beside its root .tex — no code change.
#
# See scripts/README-arxiv.md for every key and what the pipeline does with it.

root_tex = "paper.tex"
bundle_name = "perturb-seq-eval"

# Title, authors and abstract are NOT duplicated here. They are read from the CFF so
# there is one place a title can be wrong. Overriding `title`, `authors` or `abstract`
# in this file is possible but means the repo then carries two answers to one question.
citation_cff = "../CITATION.cff"


# arXiv's license menu wording. CC BY 4.0 matches the Zenodo deposit's licence, so the
# preprint and the archived record do not disagree about reuse terms.
license = "CC BY 4.0"

# The Comments field is the ONLY place on an arXiv abstract page where a DOI to an
# external archive can be stated by the author, and it is what makes the arXiv record
# and the Zenodo record discoverable as one work rather than two.
comments = """
Pre-registered study; pre-registration and provenance manifests included. \
Archived with full data and code at doi:10.5281/zenodo.19716140 (concept DOI). \
The same work is deposited on Figshare as doi:10.6084/m9.figshare.32086920 (all versions).
"""

# Packages used by this paper that are not in the pipeline's vouched TeX Live set.
# Empty means every \usepackage in the document is one the pipeline already vouches
# for. Adding a name here is an author's assertion that arXiv's TeX Live provides it.
acknowledge_packages = []

# VENUE-SPECIFIC ABSTRACT - deliberately overriding the CITATION.cff one, which is the
# canonical scholarly abstract and must not be reshaped to suit a submission form.
#
# arXiv imposes two hard limits (info.arxiv.org/help/prep): metadata fields accept ASCII
# ONLY, and "Abstracts over 1920 characters are rejected." The CFF abstract is 2548
# characters with 4 non-ASCII characters, so arXiv refuses it outright. `metadata` now
# fails closed on both, with a self-test case proving each check fires.
#
# This version is 1903 characters, 0 non-ASCII. It was rewritten for HACA-118/119 (2026-11-23) from the
# manuscript abstract, which no longer uses project shorthand: the hypotheses are named by what they
# claim instead of H1-H5, the tally is a sentence ("four of the five hypotheses are supported and the
# cross-dataset transfer hypothesis is not; every hypothesis could be evaluated"), and the
# "Design:" / "LLM condition:" / "Outcomes:" fragments are sentences. Every number, the rho = 0.286
# result and the integrity claim that every hypothesis could be evaluated are preserved; no result
# changes. The tooling checks only the length and ASCII limits; a test pins the result tokens.
# Supersedes the 1914-character override (approvals row 18, CTO #905, with the Amendment 5 rename).
# Rewritten again 2026-11-23 under approvals row 39 (review ruling A, disclose and reframe): it now states
# that the confidence drop follows shown held-out error, gives the exploratory pre-feedback rho from
# paper/sections/generated_exploratory.tex, and says the probe and recommender are not evaluated.
#
# A TOML LITERAL string is required here so the TeX backslashes are not escape-processed.
abstract = '''That a single agent's own vote distribution can gate its compute is reported (CATTS, arXiv:2602.12276); we ask the multi-agent question: does the distribution of stated confidences across a group of role-specialised agents predict task difficulty, so the group's compute can be allocated adaptively? In a five-agent CellForge-style Perturb-seq orchestrator run via MassGen, we define four trace metrics, Agent Confidence Entropy (ACE), Critique Severity Dispersion (CSD), a convergence signal ($\Delta$C) and a Winner Flip Rate (WFR), and their composite Task Difficulty Index (TDI). We pre-register five hypotheses: low attainable error on Adamson 2016 and on Norman 2019, varied backbone choice by the Architect, the rank correlation of each TDI component with error, and cross-dataset transfer of a calibrated TDI. We test them on 41 held-out K562 tasks (21 Adamson, 15 Norman singletons, 5 Norman doublets), with 27 trainer-sweep records and three fixed-length agentic runs per task, on a pinned Claude roster (Haiku 4.5, Sonnet 5.5) asserted per call. We find that four of the five hypotheses are supported and the cross-dataset transfer hypothesis is not; every hypothesis could be evaluated. Within each screen the drop in confidence across rounds ranks tasks by held-out error, but the fitted composite does not reach the transfer criterion at the pre-registered level ($\rho$ = 0.286 against > 0.4). From the second round on, every prompt carries the previous round's held-out error, so that drop is stated after an error is shown; the confidence stated before any feedback does not rank tasks ($\rho$ = 0.003 and 0.214; this is exploratory). The supported result is that stated confidence falls further where a larger error was shown, not that it anticipates difficulty. ACE, an evenness index, runs against the pre-registered direction. The probe and recommender are specified, not evaluated.'''

# NOTE: [categories] is LAST on purpose. A TOML table header captures every key
# that follows it, so a scalar placed after it silently becomes categories.<key>
# and reads as absent. Keep every top-level scalar ABOVE this line.
[categories]
# cs.LG primary: the contribution is a pre-registered test of multi-agent trace
# statistics as a task-difficulty signal (motivating adaptive compute allocation).
# q-bio.QM cross-list: the evaluation substrate is Perturb-seq response prediction,
# which is where a quantitative-biology reader would look for it. cs.MA cross-list:
# the claim is being narrowed (ruled, approvals row 11, 2026-10-31) to a MULTI-AGENT
# group's confidence/critique distribution; the nearest prior art (arXiv:2602.12276)
# is single-agent and sits in cs.AI, so the multi-agent reader is reached via cs.MA
# (ruled, approvals row 12, 2026-11-01).
primary = "cs.LG"
cross_list = ["q-bio.QM", "cs.MA"]
