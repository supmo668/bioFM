# publish.yml — one source of truth for preprint venue submissions.
#
# Consumed by `scripts/publish/submit_to_venues.py`. Human-maintained; the
# script never writes to this file — DOIs and deposition IDs go into
# `publish.state.json` (gitignored) so this stays clean.
#
# See research/PUBLISHING_RUNBOOK.md for end-to-end operation.

title: >-
  Does Agent Confidence Entropy Predict Task Difficulty? A Pre-registered,
  Provenance-Complete Test of Agentic Hyperparameter Tuning for Perturb-seq
  Response Prediction

# GENERATED from paper/paper.tex's abstract by scripts/paper/render_publish_description.py -- do not edit by hand.
description: |
  Multi-agent group-generation systems spend test-time compute uniformly
  across tasks. We ask whether the agents' own confidence-and-critique trace
  predicts how hard a task is, which would let the compute be allocated
  adaptively. Taking as testbed a five-agent orchestrator for Perturb-seq
  response prediction inspired by CellForge and operated via MassGen, we
  define four compute-free trace metrics — Agent Confidence Entropy (ACE),
  Critique Severity Dispersion (CSD), a convergence signal (ΔC), and a Winner
  Flip Rate (WFR) — and their composite, the Task Difficulty Index (TDI). We
  pre-register five hypotheses with gates: attainable error on Adamson 2016
  (CRISPR interference) and Norman 2019 (CRISPR activation), the Architect
  agent's backbone-choice entropy, the rank correlation of each TDI component
  with held-out error, and cross-dataset transfer of a calibrated TDI. The
  design is 41 held-out K562 tasks (21 Adamson, 15 Norman singletons, 5 Norman
  doublets) drawn deterministically, a trainer sweep of 27 records per task
  and three fixed-length agentic lifecycle runs per task, all in one process.
  The LLM condition is a pinned roster of Anthropic Claude models (Haiku 4.5
  for the four proposer roles, Sonnet 5.5 for the Validator) whose served
  model is recorded and asserted per call; a run with any rule-based fallback
  step is invalid. Every run records its git revision, resolved configuration,
  library versions, dataset SHA-256 digests, task plan and label contract.
  Gate outcomes: 4 of 5 gates pass; H5 fails (0 unevaluated) — the trainer
  sweep attains the pre-registered error on both screens (H1, H2), the
  Architect exercises its backbone choice (H3), and the confidence-drop
  component and the composite rank tasks by held-out error within both screens
  (H4); the Adamson-calibrated composite does not transfer to Norman at the
  pre-registered level (H5, ρ = 0.286 against > 0.4). The confidence-entropy
  point estimates run against the pre-registered direction in both screens
  (exploratory; no claim is made). The values reported in the v0.5.0 release
  of this work are superseded in full; the defects behind each are listed in
  the appendix.


# Author metadata. ORCID is optional but strongly recommended for DOI quality.
creators:
  - name: "Mo, Mang-yin"
    affiliation: "Carnegie Mellon University"
    orcid: "0009-0009-5233-3142"

keywords:
  - perturb-seq
  - Bayesian optimization
  - contextual bandit
  - multi-agent LLM
  - test-time compute
  - biological foundation model
  - pre-registration
  - provenance

# Licence applied to the paper + data. For mixed upload you can override
# per-file below.
license: cc-by-4.0

# Files to upload. Paths are relative to the project root (`projects/perturb-seq-eval/`).
# Directories are auto-zipped by scripts/publish/submit_to_venues.py.
#
# Bundle rationale (see research/PUBLISHING_RUNBOOK.md §2.5):
#   * paper.pdf           — the peer-review-style manuscript.
#   * supplement.zip      — the Adamson + revision-pass journal docs (all `docs/`
#                           Markdown + cross-referenced README). The SUPPLEMENT.md
#                           here is the reviewer-facing reproduction + results artifact.
#   * modal_run_artifacts — JSON/JSONL inputs and regenerated PDF/PNG/HTML figures.
#                           The `revision/` subdirectory has bootstrap CIs + γ_T.
files:
  # Built at deposit time by scripts/publish/build_deposit.py (paper.pdf and build/ are
  # gitignored, so the build is part of the deposit, not a precondition).
  - path: paper/paper.pdf
    name: paper.pdf
    description: "Manuscript with the v0.6.0 pre-registered results, built with tectonic from the landed sources; the build log is paper_build.log."
  - path: build/deposit/paper_build.log
    name: paper_build.log
    description: "tectonic build log of paper.pdf (overfull/undefined-reference counts are in the log)."
  - path: build/deposit/v060_run_artifacts
    name: v060_run_artifacts.zip
    description: "The pre-registered v0.6.0 run 20260929T035447Z-ce5f237 (git ce5f237, prereg_version v0.6.0-a4): trainer_runs.jsonl, lifecycle_runs.jsonl, provenance.json, summary.json, the run manifest and SHA256SUMS. Every result in paper.pdf is generated from these files."
  - path: docs
    name: supplement.zip
    description: "Supplement documentation (SUPPLEMENT.md, SUPPLEMENT_DESIGN.md, REVIEWER_CRITIQUE.md, THESIS.md, DESIGN.md, MODAL.md, PUBLICATION_CHECKLIST.md, INTERNAL_FOLLOWUP.md)."
  - path: artifacts/v0.5.0
    name: v050_run_artifacts.zip
    description: "SUPERSEDED: the v0.5.0 sweep artifacts, superseded in full by the v0.6.0 run. Kept only as the record the manuscript's 'Corrections relative to v0.5.0' appendix cites; not the source of any reported result."

# Per-venue configuration. Set enabled:false to skip.
venues:
  zenodo:
    enabled: true
    # Set sandbox:true to test against https://sandbox.zenodo.org (separate account, DOI prefix 10.5072).
    sandbox: false
    upload_type: publication
    publication_type: preprint
    # Optional — Zenodo community IDs this deposit should appear in.
    communities: []
    # Related identifiers. Real URLs only — any "REPO/PATH"-style placeholder
    # makes it into the published Zenodo metadata if left unreplaced.
    related_identifiers:
      # The code that produced this deposit (public repository).
      - identifier: "https://github.com/supmo668/bioFM"
        relation: "isSupplementedBy"
        scheme: "url"
      # v0.6.0 is a NEW VERSION of the v0.5.x work, not identical to it.
      - identifier: "10.5281/zenodo.20060974"
        relation: "isNewVersionOf"
        scheme: "doi"
      - identifier: "10.6084/m9.figshare.32086920"
        relation: "isNewVersionOf"
        scheme: "doi"

  figshare:
    enabled: true
    defined_type: preprint    # preprint | dataset | software | …
    # Figshare taxonomy category IDs (https://api.figshare.com/v2/categories).
    # Must be leaf-level (`is_selectable=true`) categories — Figshare
    # rejects parent nodes with "Not allowed to set category X".
    # Verified 2026-04-23 on the published article 32086920.
    categories:
      - 24208   # Bioinformatics and computational biology (not elsewhere classified)
      - 24193   # Genomics and transcriptomics
      - 29173   # Machine learning (not elsewhere classified)
    group_id: null            # set to a group ID for institutional-account uploads

  osf:
    # Temporarily disabled 2026-04-23: OSF's preprint subjects PATCH
    # endpoint is returning 502 Bad Gateway, and their files
    # primary_file relationship endpoint is 404ing on waterbutler-path
    # GUIDs. State file retains project/preprint IDs so the run resumes
    # cleanly once OSF recovers:
    #   python scripts/publish/submit_to_venues.py osf
    enabled: false
    # server = one of the preprint providers listed at https://osf.io/preprints/
    # biohackrxiv is the explicit hackathon fit; metaarxiv is general meta-science.
    provider: biohackrxiv
    # BioHackrXiv subject taxonomy IDs (pulled live from
    # https://api.osf.io/v2/providers/preprints/biohackrxiv/subjects/ on 2026-04-23).
    subjects:
      - "66defcf46c7cdc67bcf54ef3"   # Bioinformatics
      - "66defd3e6c7cdc67bcf55380"   # Computational Biology
