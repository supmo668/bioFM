# publish.yml — one source of truth for preprint venue submissions.
#
# Consumed by `scripts/publish/submit_to_venues.py`. Human-maintained; the
# script never writes to this file. DOIs and deposition IDs go into the release's
# state file (`state_file` below; tracked, it is the deposit-lineage record).
# `publish.state.json` is the v0.5.x record, `publish.state.v060.json` the v0.6.0 record and
# `publish.state.v061.json` the 0.6.1 record; none is written for 0.6.2 (the submitter refuses
# each name as a state file).
#
# See research/PUBLISHING_RUNBOOK.md for end-to-end operation.

# Version of the deposited work (sent to Zenodo as the record's version).
# 0.6.2 (perturb-seq-eval approvals row 41, 2026-11-24, with rows 39-40) is the Amendment 6
# manuscript revision of 0.6.1: it discloses that from round 1 on the agents' prompts carry the
# previous round's held-out error, reframes the reading of the H4 pass, adds a labelled
# exploratory section with two figures, and takes the Amendment 6 title. It includes the
# plain-English rewrite (HACA-119) and the reproducibility sentence (HACA-124). No hypothesis,
# threshold, estimator, run or outcome changed. paper/PREREGISTRATION.md IS amended (Amendment 6).
# PREPARED, NOT APPROVED FOR PUBLICATION: row 41 authorises preparation and a dry run only;
# publishing needs a separate explicit go after the dry run is reviewed (rows 2-3).
# 0.6.1 (principal 2026-11-08) was the Amendment-5 revision of v0.6.0. The git tags v0.6.0-a5 and
# v0.6.0-a6 (the latter to be created by the CTO; it does not exist yet) are PREREGISTRATION
# amendment tags only, not deposit versions.
version: "0.6.2"

# State file for THIS release (the new-version ids). 0.6.2 is the NEXT VERSION of the published
# 0.6.1 records on both venues (approvals row 41, 2026-11-24), as 0.6.1 was of v0.6.0
# (principal 2026-11-08) and v0.6.0 of v0.5.x (principal D-1 = B, 2026-10-16, CTO #647): no
# duplicate record. publish.state.json (v0.5.x), publish.state.v060.json (v0.6.0) and
# publish.state.v061.json (0.6.1) stay the lineage records and are never written.
state_file: publish.state.v062.json

# The Amendment 6 title (paper/PREREGISTRATION.md, 2026-11-24, approvals row 40), deposited with
# 0.6.2. Earlier records keep their own titles: the v0.6.0 records (Zenodo
# 10.5281/zenodo.23422745, Figshare v6) carry the pre-amendment title, and the 0.6.1 records
# (Zenodo 10.5281/zenodo.24430429, Figshare v7) the Amendment 5 title (2026-11-04, CTO #896).
# The description below is the 0.6.2 (Amendment 6) abstract.
title: >-
  Does Multi-Agent Confidence Predict Task Difficulty, or Only React to It?
  A Pre-registered Test on Perturb-seq

# GENERATED from paper/paper.tex's abstract by scripts/paper/render_publish_description.py -- do not edit by hand.
description: |
  A multi-agent group-generation system, as operated here, spends test-time
  compute uniformly across tasks. That a single agent's own vote distribution
  can gate its test-time compute is already reported by CATTS; we ask the
  multi-agent question: whether the distribution of stated confidences and
  critiques across a group of role-specialised agents predicts how hard a task
  is, which would let the group's compute be allocated adaptively. Taking as
  testbed a five-agent orchestrator for Perturb-seq response prediction
  inspired by CellForge and operated via MassGen, we define four trace metrics
  — Agent Confidence Entropy (ACE), Critique Severity Dispersion (CSD), a
  convergence signal (ΔC), and a Winner Flip Rate (WFR) — and their composite,
  the Task Difficulty Index (TDI). We pre-register five hypotheses with
  criteria: attainable error on Adamson 2016 (CRISPR interference) and Norman
  2019 (CRISPR activation), the Architect agent's backbone-choice entropy, the
  rank correlation of each TDI component with held-out error, and
  cross-dataset transfer of a calibrated TDI. The design is 41 held-out K562
  tasks (21 Adamson, 15 Norman singletons, 5 Norman doublets) drawn
  deterministically, a trainer sweep of 27 records per task and three
  fixed-length agentic lifecycle runs per task, all in one process. The agents
  are large language models (LLMs) from a pinned roster of Anthropic Claude
  models (Haiku 4.5 for the four proposer roles, Sonnet 5.5 for the Validator)
  whose served model is recorded and asserted per call; a run with any
  rule-based fallback step is invalid. Every run records its git revision,
  resolved configuration, library versions, dataset SHA-256 digests, task plan
  and label contract. We find that four of the five pre-registered hypotheses
  are supported and the cross-dataset transfer hypothesis is not; every
  hypothesis could be evaluated. The trainer sweep reaches the pre-registered
  error on both screens, and the Architect's choice of backbone varies above
  the pre-registered entropy floor. Within each screen, the drop in the
  agents' confidence across rounds, and the composite that inherits it, rank
  tasks by held-out error. From the second round on, however, every agent's
  prompt carries the previous round's held-out error, so that drop is stated
  after an error has been shown. In an exploratory analysis, the mean
  confidence stated before any feedback does not rank tasks by error (ρ =
  0.003 on Adamson and 0.214 on Norman, both intervals including zero). Read
  with the design and that analysis, the pre-registered pass is consistent
  with stated confidence falling further where a larger error was shown; it is
  not evidence that the group's confidence anticipates difficulty. The
  composite fitted on Adamson did not meet the pre-registered transfer
  criterion on Norman (ρ = 0.286 against a criterion of > 0.4). The point
  estimates for confidence entropy, an evenness index over the agents, run
  against the pre-registered direction in both screens; this is exploratory,
  and no claim is made. The preflight probe and recommender are specified but
  not evaluated. The values reported in the earlier release of this work are
  superseded in full; the defects behind each are listed in the appendix.


# Author metadata. ORCID is optional but strongly recommended for DOI quality.
creators:
  - name: "Mo, Mang-yin"
    affiliation: "Carnegie Mellon University"
    orcid: "0009-0009-5233-3142"

keywords:
  - perturb-seq
  - task difficulty
  - single-cell
  - multi-agent
  - test-time compute
  - CRISPR interference
  - pre-registration
  - provenance

# Licence applied to the paper + data. For mixed upload you can override
# per-file below.
license: cc-by-4.0

# Deposit-time sequence. 0.6.2 supersedes 0.6.1 as a NEW VERSION of the existing records
# (approvals row 41, 2026-11-24: preparation and dry run only, no publication go yet; as 0.6.1
# did v0.6.0 and v0.6.0 did v0.5.x, D-1 = B, CTO #647), so no duplicate record exists. The
# submitter performs exactly the
# two operations in ALLOWED_REVISIONS (venues.<venue>.revision_of below) and refuses any other
# write to a published or superseded record (PublishedRecordError). This sequence names the
# steps; the gated submitter is the only implementation (no raw API recipes here).
#   1. python scripts/publish/build_deposit.py   (clean tree; builds paper.pdf + log, stages the run)
#   2. Read-only GETs of the records being revised (state, version, files), immediately before
#      steps 3 and 4 (no POST/PUT/PATCH/DELETE).
#   3. Principal's go for the FIRST WRITE:
#        python scripts/publish/submit_to_venues.py zenodo --dry-run
#        python scripts/publish/submit_to_venues.py figshare --dry-run
#      Zenodo: a new-version DRAFT of 24430429 under concept 10.5281/zenodo.19716140, with the
#      inherited files replaced by the 0.6.2 set. Figshare: article 32086920's next version
#      prepared UNPUBLISHED (the public version, v7, must not change; the run checks). Nothing is
#      published. The ids are recorded in publish.state.v062.json; commit it before step 4.
#   4. Principal's SEPARATE go to publish: the same commands without --dry-run. They only
#      publish the recorded revision (DraftRequiredError otherwise), resend the metadata, refuse
#      a changed file (DraftMismatchError) and any Figshare author but expected_author. Do not
#      rebuild between steps 3 and 4.
#   5. After both publishes: set CITATION.cff `version: "0.6.2"` and `date-released`; add
#      the 0.6.2 Zenodo DOI and the Figshare v8 DOI to its `identifiers`, and drop "this release"
#      from the 24430429 entry; mark the CHANGELOG 0.6.2 entry published with both DOIs. Then a
#      Zenodo metadata-only edit of the 0.6.2 record adding `isIdenticalTo` the Figshare v8 DOI
#      (as was done for v6 on 2026-10-25).
files:
  # Built at deposit time by scripts/publish/build_deposit.py (paper.pdf and build/ are
  # gitignored, so the build is part of the deposit, not a precondition).
  - path: paper/paper.pdf
    name: paper.pdf
    description: "The 0.6.2 manuscript (Amendment 6) of the v0.6.0 pre-registered results: it discloses the error feedback in the agents' prompts, reframes the reading of the H4 pass and adds a labelled exploratory section with two figures; no hypothesis, threshold, estimator, run or outcome changed. Built with tectonic from the landed sources; the build log is paper_build.log."
  - path: build/deposit/paper_build.log
    name: paper_build.log
    description: "tectonic build log of paper.pdf (overfull/undefined-reference counts are in the log)."
  - path: build/deposit/v060_run_artifacts
    name: v060_run_artifacts.zip
    description: "The pre-registered v0.6.0 run 20260929T035447Z-ce5f237 (git ce5f237, prereg_version v0.6.0-a4): trainer_runs.jsonl, lifecycle_runs.jsonl, provenance.json, summary.json, the run manifest and SHA256SUMS. Every result in paper.pdf is generated from these files."
  - path: docs
    name: supplement.zip
    description: "SUPERSEDED: v0.5-era design and supplement documentation (docs/), kept for the record. It describes the earlier OpenRouter condition and the best-of-54 grid; it is not the source of any v0.6.0 result -- paper.pdf and v060_run_artifacts.zip are."
  - path: artifacts/v0.5.0
    name: v050_run_artifacts.zip
    description: "SUPERSEDED: the v0.5.0 sweep artifacts, superseded in full by the v0.6.0 run. Kept only as the record the manuscript's 'Corrections relative to v0.5.0' appendix cites; not the source of any reported result."

# Per-venue configuration. Set enabled:false to skip.
venues:
  zenodo:
    enabled: true
    # Set sandbox:true to test against https://sandbox.zenodo.org (separate account, DOI prefix 10.5072).
    sandbox: false
    upload_type: publication
    publication_type: preprint
    # Optional — Zenodo community IDs this deposit should appear in.
    communities: []
    # Related identifiers. Real URLs only — any "REPO/PATH"-style placeholder
    # makes it into the published Zenodo metadata if left unreplaced.
    related_identifiers:
      # The code that produced the run (pinned to the run's git sha ce5f237).
      - identifier: "https://github.com/supmo668/bioFM/tree/ce5f2379bac485930ff57c4b9e96a486676413a8/projects/perturb-seq-eval"
        relation: "isSupplementedBy"
        scheme: "url"
      # 0.6.2 is the next version of the 0.6.1 work under the same concept DOI, not identical.
      - identifier: "10.5281/zenodo.24430429"
        relation: "isNewVersionOf"
        scheme: "doi"
      - identifier: "10.6084/m9.figshare.32086920.v7"
        relation: "isNewVersionOf"
        scheme: "doi"
    # The one permitted Zenodo revision (ALLOWED_REVISIONS): a new version from 0.6.1.
    revision_of: 24430429
    # The notes name the amendment tag v0.6.0-a6. The CTO creates it on the landed commit; it must
    # exist before the dry run, or the notes would cite a tag that does not exist.
    notes: >-
      0.6.2 is the next version of this record (concept DOI 10.5281/zenodo.19716140), carrying
      Amendment 6 of the pre-registration (tag v0.6.0-a6). The manuscript now discloses that
      from the second round on (round 1 in the run's zero-based indexing) every agent's prompt
      carries the previous round's held-out error, which neither the pre-registration nor the
      earlier versions stated. It reframes the reading of the H4 pass accordingly: the pass is
      consistent with stated confidence falling further where a larger error was shown, and is
      not evidence that the group's confidence anticipates difficulty. It adds an exploratory
      section with two figures, labelled exploratory and added after the outcomes were known,
      and the paper is retitled 'Does Multi-Agent Confidence Predict Task Difficulty, or Only
      React to It? A Pre-registered Test on Perturb-seq'. The text is also rewritten in plain
      academic English, with one added sentence on reproducing two values across numerical
      libraries. No hypothesis, threshold, estimator, run or outcome changed.

  figshare:
    enabled: true
    defined_type: preprint    # preprint | dataset | software | …
    # Figshare taxonomy category IDs (https://api.figshare.com/v2/categories).
    # Must be leaf-level (`is_selectable=true`) categories — Figshare
    # rejects parent nodes with "Not allowed to set category X".
    # Verified 2026-04-23 on the published article 32086920.
    categories:
      - 24208   # Bioinformatics and computational biology (not elsewhere classified)
      - 24193   # Genomics and transcriptomics
      - 29173   # Machine learning (not elsewhere classified)
    group_id: null            # set to a group ID for institutional-account uploads
    # Figshare names the author from the depositing account's profile (no authors are sent).
    # A publish run refuses unless the draft has exactly this one author (principal 2026-10-16:
    # profile renamed to the ruled spelling; differs in form from Zenodo's "Family, Given").
    expected_author: "Mang-yin Mo"
    # The one permitted Figshare revision (ALLOWED_REVISIONS): article 32086920's next version.
    revision_of: 32086920
    # References carried by the 0.6.2 article (sent with its metadata; they replace the list the
    # v7 article carries).
    references:
      - "https://doi.org/10.5281/zenodo.19716140"
      - "https://github.com/supmo668/bioFM/tree/ce5f2379bac485930ff57c4b9e96a486676413a8/projects/perturb-seq-eval"

  osf:
    # Temporarily disabled 2026-04-23: OSF's preprint subjects PATCH
    # endpoint is returning 502 Bad Gateway, and their files
    # primary_file relationship endpoint is 404ing on waterbutler-path
    # GUIDs. The v0.5.x project/preprint ids (publish.state.json) are superseded and never
    # resumed (SUPERSEDED_RECORDS; OSF has no permitted revision); re-enabling OSF creates a new project/preprint
    # in this release's state_file.
    enabled: false
    # server = one of the preprint providers listed at https://osf.io/preprints/
    # biohackrxiv is the explicit hackathon fit; metaarxiv is general meta-science.
    provider: biohackrxiv
    # BioHackrXiv subject taxonomy IDs (pulled live from
    # https://api.osf.io/v2/providers/preprints/biohackrxiv/subjects/ on 2026-04-23).
    subjects:
      - "66defcf46c7cdc67bcf54ef3"   # Bioinformatics
      - "66defd3e6c7cdc67bcf55380"   # Computational Biology
