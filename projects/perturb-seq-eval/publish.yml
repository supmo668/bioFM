# 0.6.3 (perturb-seq-eval approvals row 45, 2026-11-25) is the self-contained rewrite of the
# manuscript asked for in row 42: the hypotheses and the amendments are named in words instead
# of by label, abbreviations and symbols are defined at first use, and the CellForge reference
# is corrected. No hypothesis, threshold, estimator, run or outcome changed, and
# paper/PREREGISTRATION.md is not changed by it. PREPARED, NOT PUBLISHED: row 45 covers the
# relabel and a dry run only, and publishing 0.6.3 needs a separate explicit go.
# 0.6.2 (approvals row 41, with rows 39-40) is the manuscript of the sixth amendment to the
# pre-registration (Amendment 6), BEFORE that rewrite. PUBLISHED 2026-11-25 on the principal's
# separate go (approvals row 43): Zenodo 10.5281/zenodo.24518637 and Figshare
# 10.6084/m9.figshare.32086920.v8, built from commit 07a5e57b (git tag v0.6.2).
# 0.6.1 (principal 2026-11-08) was the Amendment-5 revision of v0.6.0. The git tags v0.6.0-a5 and
# v0.6.0-a6 (the latter exists: an annotated tag on commit 07a5e57b, created 2026-11-25) are
# PREREGISTRATION amendment tags only, not deposit versions; neither marks a release. Commit
# 07a5e57b also carries the release tag v0.6.2, because the 0.6.2 deposit was built from it.
version: "0.6.3"

# State file for THIS release (the new-version ids). 0.6.3 is the NEXT VERSION of the published
# 0.6.2 records on both venues (approvals row 45, 2026-11-25), as 0.6.2 was of 0.6.1 (row 41),
# 0.6.1 of v0.6.0 (principal 2026-11-08) and v0.6.0 of v0.5.x (principal D-1 = B, 2026-10-16,
# CTO #647): no duplicate record. publish.state.json (v0.5.x), publish.state.v060.json (v0.6.0),
# publish.state.v061.json (0.6.1) and publish.state.v062.json (0.6.2) stay the lineage records
# and are never written.
state_file: publish.state.v063.json

# The Amendment 6 title (paper/PREREGISTRATION.md, 2026-11-24, approvals row 40), first deposited
# with 0.6.2 and unchanged in 0.6.3. Earlier records keep their own titles: the v0.6.0 records
# (Zenodo 10.5281/zenodo.23422745, Figshare v6) carry the pre-amendment title, and the 0.6.1
# records (Zenodo 10.5281/zenodo.24430429, Figshare v7) the Amendment 5 title (2026-11-04,
# CTO #896). The description below is the 0.6.3 abstract; the 0.6.2 records (Zenodo
# 10.5281/zenodo.24518637, Figshare v8) carry the abstract as it read before the rewrite.
title: >-
  Does Multi-Agent Confidence Predict Task Difficulty, or Only React to It?
  A Pre-registered Test on Perturb-seq

# GENERATED from paper/paper.tex's abstract by scripts/paper/render_publish_description.py -- do not edit by hand.
description: |
  A multi-agent group-generation system, in which language-model agents
  propose, critique and vote over several rounds, spends test-time compute
  (computation at inference) uniformly across tasks as operated here. That a
  single agent's own vote distribution can gate its test-time compute is
  already reported by the CATTS method of Lee and colleagues (2026); we ask
  the multi-agent question: whether the distribution of stated confidences and
  critiques across a group of role-specialised agents predicts how hard a task
  is, which would let the group's compute be allocated adaptively. The testbed
  is a five-agent orchestrator that predicts gene-expression responses in
  Perturb-seq data (pooled CRISPR screens read out by single-cell RNA
  sequencing), inspired by the CellForge system and operated with the MassGen
  framework. We define metrics on the record of a run, among them Agent
  Confidence Entropy (an evenness index of the agents' stated confidences) and
  the change in the agents' mean stated confidence from the first round to the
  last, and a composite, the Task Difficulty Index (TDI). The testbed records
  no agent-by-agent critiques and no per-round winner, so only the confidence
  metrics and their composite are tested. We pre-register five hypotheses,
  each with a criterion: that a sweep of trained models can attain low error,
  taking the best configuration for each task (a best-case bound, selected on
  the data it is scored on), on each of two screens of the K562 cell line,
  Adamson 2016 (CRISPR interference) and Norman 2019 (CRISPR activation); that
  the Architect, the agent that selects the prediction model (the backbone),
  states varied choices, as measured by their Shannon entropy; that one of
  those metrics or their composite ranks tasks, within a screen, by held-out
  error (the mean squared deviation on the twenty most differentially
  expressed genes of the held-out perturbation); and that a composite fitted
  on one screen (its weights estimated by regression on that screen's tasks)
  ranks the tasks of the other. The design is 41 held-out perturbations,
  called tasks (21 from Adamson, and 15 single-gene and 5 two-gene
  perturbations from Norman), a sweep of 27 model fits per task, and three
  runs of the agents per task, each of exactly three rounds. The agents are
  large language models from a pinned roster of Anthropic Claude models (Haiku
  4.5 for the four roles that propose, Sonnet 5.5 for the role that validates)
  whose served model is recorded and asserted per call. A run in which any
  agent step falls back to a rule-based default is invalid, and every run
  records its code revision, configuration, dataset digests and serving
  models. We find that four of the five pre-registered hypotheses are
  supported and the cross-dataset transfer hypothesis is not; every hypothesis
  could be evaluated. The sweep reaches the pre-registered error on both
  screens, and the entropy of the Architect's stated choices is above the
  pre-registered minimum. Within each screen, the drop in the agents' mean
  confidence across rounds, and the composite that includes it, rank tasks by
  held-out error, which meets the pre-registered ranking criterion. From the
  second round on, however, every agent's prompt carries the previous round's
  held-out error, so that drop is stated after an error has been shown. In an
  exploratory analysis, the mean confidence stated before any feedback does
  not rank tasks by error (Spearman's rank correlation ρ = 0.003 on Adamson
  and 0.214 on Norman, both confidence intervals including zero). Read with
  the design and that analysis, the pre-registered pass is consistent with
  stated confidence falling further where a larger error was shown; it is not
  evidence that the group's confidence anticipates difficulty. The composite
  fitted on Adamson did not meet the pre-registered transfer criterion on
  Norman (ρ = 0.286 against a criterion of > 0.4). The point estimates for
  Agent Confidence Entropy run against the pre-registered direction in both
  screens; this observation is exploratory and supports no claim. A probe that
  would observe the agents' confidences and critiques in a single shallow
  round, and a rule that would recommend an agent configuration from it, are
  specified but not evaluated. The values reported in the earlier release
  (v0.5.0) are superseded in full; the appendix lists the defects behind each.


# Author metadata. ORCID is optional but strongly recommended for DOI quality.
creators:
  - name: "Mo, Mang-yin"
    affiliation: "Carnegie Mellon University"
    orcid: "0009-0009-5233-3142"

keywords:
  - perturb-seq
  - task difficulty
  - single-cell
  - multi-agent
  - test-time compute
  - CRISPR interference
  - pre-registration
  - provenance

# Licence applied to the paper + data. For mixed upload you can override
# per-file below.
license: cc-by-4.0

# Deposit-time sequence. 0.6.3 supersedes 0.6.2 as a NEW VERSION of the existing records
# (approvals row 45, 2026-11-25: relabel and dry run only; as 0.6.2 did 0.6.1 on the go of
# row 43, 0.6.1 did v0.6.0 and v0.6.0 did v0.5.x, D-1 = B, CTO #647), so no duplicate record
# exists. The submitter performs exactly the
# two operations in ALLOWED_REVISIONS (venues.<venue>.revision_of below) and refuses any other
# write to a published or superseded record (PublishedRecordError). This sequence names the
# steps; the gated submitter is the only implementation (no raw API recipes here).
#   1. python scripts/publish/build_deposit.py   (clean tree; builds paper.pdf + log, stages the run)
#   2. Read-only GETs of the records being revised (state, version, files), immediately before
#      steps 3 and 4 (no POST/PUT/PATCH/DELETE).
#   3. Principal's go for the FIRST WRITE:
#        python scripts/publish/submit_to_venues.py zenodo --dry-run
#        python scripts/publish/submit_to_venues.py figshare --dry-run
#      Zenodo: a new-version DRAFT of 24518637 under concept 10.5281/zenodo.19716140, with the
#      inherited files replaced by the 0.6.3 set. Figshare: article 32086920's next version
#      prepared UNPUBLISHED (the public version, v8, must not change; the run checks). Nothing is
#      published. The ids are recorded in publish.state.v063.json; commit it before step 4.
#   4. Principal's SEPARATE go to publish: the same commands without --dry-run. They only
#      publish the recorded revision (DraftRequiredError otherwise), resend the metadata, refuse
#      a changed file (DraftMismatchError) and any Figshare author but expected_author. Do not
#      rebuild between steps 3 and 4.
#   5. After both publishes: set CITATION.cff `version: "0.6.3"` and `date-released`; add
#      the 0.6.3 Zenodo DOI and the Figshare v9 DOI to its `identifiers`, and drop "the latest
#      published release" from the 24518637 entry; mark the CHANGELOG 0.6.3 entry published with
#      both DOIs. Then a
#      Zenodo metadata-only edit of the 0.6.3 record adding `isIdenticalTo` the Figshare v9 DOI
#      (as was done for v6 on 2026-10-25).
files:
  # Built at deposit time by scripts/publish/build_deposit.py (paper.pdf and build/ are
  # gitignored, so the build is part of the deposit, not a precondition).
  - path: paper/paper.pdf
    name: paper.pdf
    description: "The manuscript, version 0.6.3, reporting the pre-registered results of the v0.6.0 run. Relative to version 0.6.2 only the wording changed: the hypotheses and the amendments to the pre-registration are named in words instead of by label, abbreviations and symbols are defined where they are first used, and one reference (the CellForge preprint) is corrected. Like version 0.6.2, it discloses that the agents' prompts carry the previous round's held-out error, reads the supported trace-feature ranking hypothesis (that a feature of the agents' stated confidences ranks tasks by held-out error) accordingly, and has an exploratory section with two figures, labelled as added after the outcomes were known; these are recorded as the sixth amendment to the pre-registration, listed in the manuscript's table of amendments. No hypothesis, threshold, estimator, run or outcome changed. Built from the repository's LaTeX sources with the tectonic engine; the build log is paper_build.log."
  - path: build/deposit/paper_build.log
    name: paper_build.log
    description: "Build log written by the tectonic LaTeX engine when it compiled paper.pdf; it records any overfull boxes and undefined references."
  - path: build/deposit/v060_run_artifacts
    name: v060_run_artifacts.zip
    description: "The files of the pre-registered v0.6.0 run, run identifier 20260929T035447Z-ce5f237, made at git revision ce5f237 under the pre-registration version labelled v0.6.0-a4: the records of the trained-model sweep (trainer_runs.jsonl) and of the agents' runs (lifecycle_runs.jsonl), the provenance record (provenance.json), the analysis summary (summary.json), the run manifest and a SHA-256 checksum list (SHA256SUMS). Every result in paper.pdf is generated from these files."
  - path: docs
    name: supplement.zip
    description: "SUPERSEDED: design and supplement documentation written for version 0.5 of this work (the docs/ directory of the repository), kept for the record. It describes the earlier design, in which the language models were served through the OpenRouter API and the trained-model sweep had 54 configurations per task; it is not the source of any result in paper.pdf. The sources of the results are paper.pdf and v060_run_artifacts.zip."
  - path: artifacts/v0.5.0
    name: v050_run_artifacts.zip
    description: "SUPERSEDED: the run files of version 0.5.0 of this work, superseded in full by the v0.6.0 run. They are kept only as the record that the manuscript's appendix 'Corrections relative to v0.5.0' cites, and are not the source of any reported result."

# Per-venue configuration. Set enabled:false to skip.
venues:
  zenodo:
    enabled: true
    # Set sandbox:true to test against https://sandbox.zenodo.org (separate account, DOI prefix 10.5072).
    sandbox: false
    upload_type: publication
    publication_type: preprint
    # Optional — Zenodo community IDs this deposit should appear in.
    communities: []
    # Related identifiers. Real URLs only — any "REPO/PATH"-style placeholder
    # makes it into the published Zenodo metadata if left unreplaced.
    related_identifiers:
      # The code that produced the run (pinned to the run's git sha ce5f237).
      - identifier: "https://github.com/supmo668/bioFM/tree/ce5f2379bac485930ff57c4b9e96a486676413a8/projects/perturb-seq-eval"
        relation: "isSupplementedBy"
        scheme: "url"
      # 0.6.3 is the next version of the 0.6.2 work under the same concept DOI, not identical.
      - identifier: "10.5281/zenodo.24518637"
        relation: "isNewVersionOf"
        scheme: "doi"
      - identifier: "10.6084/m9.figshare.32086920.v8"
        relation: "isNewVersionOf"
        scheme: "doi"
    # The one permitted Zenodo revision (ALLOWED_REVISIONS): a new version from 0.6.2.
    revision_of: 24518637
    # The notes name the amendment tag v0.6.0-a6. It exists: an annotated tag on commit 07a5e57b,
    # created 2026-11-25. It marks the amendment, not a release.
    notes: >-
      0.6.3 is the next version of this record (concept DOI 10.5281/zenodo.19716140). It
      revises the wording of version 0.6.2 and reports the same pre-registered run. The
      manuscript is made self-contained: the hypotheses are named by what they claim and the
      amendments to the pre-registration by number, in words, instead of by the labels that
      version 0.6.2 still used in places, and abbreviations and symbols are defined where
      they are first used, in the abstract, the text, the tables and the captions.
      Version 0.6.2 already carries the sixth amendment to the study's pre-registration
      (Amendment 6, repository tag v0.6.0-a6), which is listed with the earlier amendments
      in the manuscript's table of amendments: the title 'Does Multi-Agent Confidence
      Predict Task Difficulty, or Only React to It? A Pre-registered Test on Perturb-seq',
      the disclosure that from the second round on (round 1 in the run's zero-based
      numbering) every agent's prompt carries the previous round's held-out error, the
      reading of the supported trace-feature ranking hypothesis that follows from it, and
      an exploratory section with two figures; none of that is changed in this version. One
      reference is corrected: the CellForge preprint (arXiv:2508.02276), which versions up
      to 0.6.2 credited to 'Xiangru Chen and others' in the bibliography and to 'Wei, Yi'
      under a different title in the citation file, is by Xiangru Tang, Jiapeng Chen, Daniel
      Shao, Zhuoyun Yu and others (15 authors); its version-1 title is 'CellForge: Agentic
      Design of Virtual Cell Models' and its current title is 'AI Scientists for Building
      Virtual-Cell Models'. No hypothesis, threshold, estimator, run or outcome changed.

  figshare:
    enabled: true
    defined_type: preprint    # preprint | dataset | software | …
    # Figshare taxonomy category IDs (https://api.figshare.com/v2/categories).
    # Must be leaf-level (`is_selectable=true`) categories — Figshare
    # rejects parent nodes with "Not allowed to set category X".
    # Verified 2026-04-23 on the published article 32086920.
    categories:
      - 24208   # Bioinformatics and computational biology (not elsewhere classified)
      - 24193   # Genomics and transcriptomics
      - 29173   # Machine learning (not elsewhere classified)
    group_id: null            # set to a group ID for institutional-account uploads
    # Figshare names the author from the depositing account's profile (no authors are sent).
    # A publish run refuses unless the draft has exactly this one author (principal 2026-10-16:
    # profile renamed to the ruled spelling; differs in form from Zenodo's "Family, Given").
    expected_author: "Mang-yin Mo"
    # The one permitted Figshare revision (ALLOWED_REVISIONS): article 32086920's next version.
    revision_of: 32086920
    # References carried by the 0.6.3 article (sent with its metadata; they replace the list the
    # v8 article carries).
    references:
      - "https://doi.org/10.5281/zenodo.19716140"
      - "https://github.com/supmo668/bioFM/tree/ce5f2379bac485930ff57c4b9e96a486676413a8/projects/perturb-seq-eval"

  osf:
    # Temporarily disabled 2026-04-23: OSF's preprint subjects PATCH
    # endpoint is returning 502 Bad Gateway, and their files
    # primary_file relationship endpoint is 404ing on waterbutler-path
    # GUIDs. The v0.5.x project/preprint ids (publish.state.json) are superseded and never
    # resumed (SUPERSEDED_RECORDS; OSF has no permitted revision); re-enabling OSF creates a new project/preprint
    # in this release's state_file.
    enabled: false
    # server = one of the preprint providers listed at https://osf.io/preprints/
    # biohackrxiv is the explicit hackathon fit; metaarxiv is general meta-science.
    provider: biohackrxiv
    # BioHackrXiv subject taxonomy IDs (pulled live from
    # https://api.osf.io/v2/providers/preprints/biohackrxiv/subjects/ on 2026-04-23).
    subjects:
      - "66defcf46c7cdc67bcf54ef3"   # Bioinformatics
      - "66defd3e6c7cdc67bcf55380"   # Computational Biology
